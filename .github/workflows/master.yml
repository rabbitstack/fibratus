name: master

on:
  push:
    branches:
      - master
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "docs/**"

env:
  GO_VERSION: 1.27.x
  WIX_VERSION: 5.0.0
  PYTHON_VERSION: 3.7.9
  SYSTEM_TEST_PYTHON_VERSION: 3.12

jobs:
  build:
      runs-on: windows-latest
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
        with:
          build-yara: true
      - name: Build
        shell: bash
        run: |
          export PATH=/c/msys64/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=$(pwd)/pkg-config
          export COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          export VERSION=0.0.0
          ./make.bat mc
          ./make.bat rsrc
          ./make.bat
        env:
          TAGS: cap,filament,yara,yara_static
      - uses: actions/upload-artifact@v4
        with:
          name: "fibratus-amd64.exe"
          path: "./cmd/fibratus/fibratus.exe"
      - name: Install Wix
        shell: bash
        run: |
          dotnet tool install --global wix --version $WIX_VERSION
      - name: Package
        shell: bash
        run: |
           export VERSION=0.0.0
           ./make.bat pkg
      - uses: actions/upload-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: "./build/msi/fibratus-0.0.0-amd64.msi"

  build-slim:
      runs-on: windows-latest
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        shell: bash
        run: |
          export COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          ./make.bat
      - uses: actions/upload-artifact@v4
        with:
          name: "fibratus-amd64-slim.exe"
          path: "./cmd/fibratus/fibratus.exe"

  unit-test:
    runs-on: windows-latest
    needs:
      - build
      - build-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Test
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat unit-test
        env:
          TAGS: cap,yara,yara_static

  integration-test:
    runs-on: windows-latest
    needs:
      - build
      - build-slim
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Setup test fixtures
        run: |
          choco install -y go-task
          task --taskfile internal/etw/_fixtures/Taskfile.yml all
      - name: Test
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat integration-test
        env:
          TAGS: cap,yara,yara_static

  system-test:
    runs-on: windows-latest
    needs:
      - build
      - build-slim
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.SYSTEM_TEST_PYTHON_VERSION }}
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: .
      - name: Run helper unit tests
        shell: bash
        run: |
          python -m unittest discover -s test/tests -t test
      - name: Install test-runner package
        shell: bash
        run: | 
          pip install -e test/
      - name: Install Fibratus
        shell: bash
        run: |
          test-runner install --msi fibratus-0.0.0-amd64.msi
      - name: Check service is running
        shell: bash
        run: |
          test-runner check-service
          sleep 20
      - name: Fire rules and verify alerts
        shell: bash
        run: |
          test-runner check-rules
      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          test-runner collect-diagnostics --output-dir system-test-output
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "system-test-diagnostics"
          path: system-test-output
          if-no-files-found: ignore

  lint:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Install golangci-lint
        shell: bash
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin $GOLANGCI_LINT_VER
        env:
          GOLANGCI_LINT_VER: v2.14.0
      - name: Lint
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat lint

  validate-rules:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: .
      - name: Install Fibratus
        shell: bash
        run: |
          ./make.bat install
      - name: Validate
        shell: bash
        run: |
          export PATH="/c/Program Files/Fibratus/Bin:$PATH"
          fibratus rules list
          fibratus rules validate
