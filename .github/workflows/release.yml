name: release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: 1.27.x
  WIX_VERSION: 5.0.0
  PYTHON_VERSION: 3.7.9

jobs:
  build:
      runs-on: windows-latest
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
        with:
          build-yara: true
      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3 | cut -c2-)" >> $GITHUB_OUTPUT
      - name: Build
        shell: bash
        run: |
          export PATH=/c/msys64/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=$(pwd)/pkg-config
          export COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          export VERSION=${{ steps.get_version.outputs.VERSION }}
          ./make.bat mc
          ./make.bat rsrc
          ./make.bat
        env:
          TAGS: cap,filament,yara,yara_static
      - name: Install Wix
        shell: bash
        run: |
          dotnet tool install --global wix --version $WIX_VERSION
      - name: Package
        shell: bash
        run: |
          export VERSION=${{ steps.get_version.outputs.VERSION }}
          ./make.bat pkg
          mkdir ./build/msi/signed
      - uses: actions/upload-artifact@v4
        id: upload-msi
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi
          path: "./build/msi/fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi"
      - name: Sign MSI
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORG_ID }}"
          project-slug: "fibratus"
          signing-policy-slug: "release-signing"
          github-artifact-id: "${{ steps.upload-msi.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "./build/msi/signed"
      - uses: actions/upload-artifact@v4
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi
          path: "./build/msi/signed/fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi"
          overwrite: true

  build-slim:
      runs-on: windows-latest
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3 | cut -c2-)" >> $GITHUB_OUTPUT
      - name: Build
        shell: bash
        run: |
          export PATH=/c/msys64/mingw64/bin:$PATH
          export COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          export VERSION=${{ steps.get_version.outputs.VERSION }}
          ./make.bat mc
          ./make.bat rsrc
          ./make.bat
      - name: Install Wix
        shell: bash
        run: |
          dotnet tool install --global wix --version $WIX_VERSION
      - name: Package
        shell: bash
        run: |
          export VERSION=${{ steps.get_version.outputs.VERSION }}
          ./make.bat pkg-slim
          mkdir ./build/msi/signed
      - uses: actions/upload-artifact@v4
        id: upload-msi
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi
          path: "./build/msi/fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi"
      - name: Sign MSI
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
          organization-id: "${{ secrets.SIGNPATH_ORG_ID }}"
          project-slug: "fibratus"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: "fibratus-slim"
          github-artifact-id: "${{ steps.upload-msi.outputs.artifact-id }}"
          wait-for-completion: true
          output-artifact-directory: "./build/msi/signed"
      - uses: actions/upload-artifact@v4
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi
          path: "./build/msi/signed/fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi"
          overwrite: true

  release:
      runs-on: windows-latest
      needs:
        - build
        - build-slim
      steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: get_version
        shell: bash
        run: |
          echo "VERSION=$(echo $GITHUB_REF | cut -d / -f 3 | cut -c2-)" >> $GITHUB_OUTPUT
      - uses: actions/download-artifact@v4
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi
          path: build
      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $files = @(
            "fibratus-$version-amd64.msi",
            "fibratus-$version-slim-amd64.msi"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash "build\$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file" | Out-File -FilePath "build\$file.sha256" -Encoding utf8
          }
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          prerelease: true
          files: |
             build/fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi
             build/fibratus-${{ steps.get_version.outputs.VERSION }}-amd64.msi.sha256
             build/fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi
             build/fibratus-${{ steps.get_version.outputs.VERSION }}-slim-amd64.msi.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
