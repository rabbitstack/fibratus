name: pr

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.27.x
  WIX_VERSION: 5.0.0
  PYTHON_VERSION: 3.7.9
  SYSTEM_TEST_PYTHON_VERSION: 3.12

jobs:
  build:
      runs-on: windows-latest
      steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
        with:
          build-yara: true
      - name: Build
        shell: bash
        run: |
          export PATH=/c/msys64/mingw64/bin:$PATH
          export PKG_CONFIG_PATH=$(pwd)/pkg-config
          export COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          export VERSION=0.0.0
          ./make.bat mc
          ./make.bat rsrc
          ./make.bat
        env:
          TAGS: cap,filament,yara,yara_static
      - uses: actions/upload-artifact@v4
        with:
          name: "fibratus-amd64.exe"
          path: "./cmd/fibratus/fibratus.exe"
      - name: Install Wix
        shell: bash
        run: |
          dotnet tool install --global wix --version $WIX_VERSION
      - name: Package
        shell: bash
        run: |
          export VERSION=0.0.0
          ./make.bat pkg
      - uses: actions/upload-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: "./build/msi/fibratus-0.0.0-amd64.msi"

  unit-test:
    runs-on: windows-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Test
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat unit-test
        env:
          TAGS: cap,yara,yara_static

  integration-test:
    runs-on: windows-latest
    needs:
      - build
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Setup test fixtures
        run: |
          choco install -y go-task
          task --taskfile internal/etw/_fixtures/Taskfile.yml all
      - name: Test
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat integration-test
        env:
          TAGS: cap,yara,yara_static

  system-test:
    runs-on: windows-latest
    needs:
      - build
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.SYSTEM_TEST_PYTHON_VERSION }}
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: .
      - name: Run helper unit tests
        shell: bash
        run: |
          python -m unittest discover -s test/tests -t test
      - name: Install test-runner package
        shell: bash
        run: |
          pip install -e test/
      - name: Install Fibratus
        shell: bash
        run: |
         test-runner install --msi fibratus-0.0.0-amd64.msi
      - name: Check service is running
        shell: bash
        run: |
          test-runner check-service
          sleep 20
      - name: Fire rules and verify alerts
        shell: bash
        run: |
          test-runner check-rules
      - name: Collect diagnostics
        shell: bash
        run: |
          test-runner collect-diagnostics --output-dir system-test-output
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: "system-test-diagnostics"
          path: system-test-output
          if-no-files-found: ignore

  lint:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Adjust pkg-config prefix
        shell: bash
        run: |
           sed -i 's/C:\/Python37/C:\/hostedtoolcache\/windows\/Python\/3.7.9\/x64/' pkg-config/python-37.pc
      - name: Install YARA
        uses: ./.github/actions/setup-yara
      - name: Install golangci-lint
        shell: bash
        run: |
          curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin $GOLANGCI_LINT_VER
        env:
          GOLANGCI_LINT_VER: v2.14.0
      - name: Lint
        shell: bash
        run: |
           export PATH="/c/msys64/mingw64/bin:$PATH"
           export PKG_CONFIG_PATH=$(pwd)/pkg-config
           ./make.bat lint

  validate-rules:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Download MSI
        uses: actions/download-artifact@v4
        with:
          name: "fibratus-amd64.msi"
          path: .
      - name: Install Fibratus
        shell: bash
        run: |
          ./make.bat install
      - name: Validate
        shell: bash
        run: |
          export PATH="/c/Program Files/Fibratus/Bin:$PATH"
          fibratus rules list
          fibratus rules validate
      - name: Get changed rules
        id: changed-rules
        uses: tj-actions/changed-files@v45
        with:
          files: |
            rules/**.yml
      - name: Check version increment
        if: steps.changed-rules.outputs.any_changed == 'true'
        env:
          CHANGED_RULES: ${{ steps.changed-rules.outputs.modified_files }}
        shell: bash
        run: |
          choco install yq -y
          for rule in ${CHANGED_RULES}; do
            RULE="${rule//\\//}"
            HEAD_VERSION=$(git show HEAD~1:$RULE | yq '.version')
            CURR_VERSION=$(yq '.version' $rule)
            if [[ "$HEAD_VERSION" == "$CURR_VERSION" ]]; then
              echo "$(basename $rule) changed but the version is not incremented. HEAD version: $HEAD_VERSION"
              exit 1
            fi
          done
